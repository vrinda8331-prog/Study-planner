<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyHub</title>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Plus Jakarta Sans',sans-serif;
background:#060816;
color:white;
display:flex;
min-height:100vh;
overflow-x:hidden;
}

/* SIDEBAR */

.sidebar{
width:240px;
background:#111827;
padding:25px;
position:fixed;
height:100vh;
border-right:1px solid rgba(255,255,255,.08);
}

.logo{
font-size:2rem;
font-weight:800;
margin-bottom:40px;

background:linear-gradient(135deg,#8B5CF6,#06B6D4);
-webkit-background-clip:text;
background-clip:text;
-webkit-text-fill-color:transparent;
}

.nav-btn{
width:100%;
padding:15px;
margin-bottom:12px;
border:none;
border-radius:16px;
background:transparent;
color:#94A3B8;
font-size:1rem;
cursor:pointer;
text-align:left;
transition:.3s;
}

.nav-btn:hover,
.nav-btn.active{
background:linear-gradient(135deg,#8B5CF6,#06B6D4);
color:white;
}

/* MAIN */

.main{
margin-left:240px;
padding:40px;
width:100%;
}

.tab{
display:none;
}

.tab.active{
display:block;
}

/* HERO */

.hero{
padding:60px;
border-radius:32px;
background:linear-gradient(
135deg,
rgba(139,92,246,.25),
rgba(6,182,212,.12)
);

margin-bottom:35px;
}

.hero h1{
font-size:4rem;
margin-bottom:20px;
}

.hero p{
color:#94A3B8;
max-width:600px;
line-height:1.8;
}

/* CARDS */

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
background:#111827;
padding:30px;
border-radius:24px;
}

.card small{
color:#94A3B8;
display:block;
margin-bottom:12px;
}

.card h2{
font-size:3rem;
}

/* TASKS */

.section-title{
font-size:2.5rem;
margin-bottom:25px;
}

.input-group{
display:flex;
gap:12px;
margin-bottom:25px;
}

input,
textarea{
width:100%;
padding:16px;
border:none;
border-radius:16px;
background:#111827;
color:white;
font-size:1rem;
}

button{
border:none;
padding:14px 22px;
border-radius:14px;
cursor:pointer;
font-weight:700;

background:linear-gradient(
135deg,
#8B5CF6,
#06B6D4
);

color:white;
}

.task,
.note{
background:#111827;
padding:20px;
border-radius:18px;
margin-bottom:18px;
display:flex;
justify-content:space-between;
align-items:center;
}

.delete-btn{
background:#EF4444;
}

/* TIMER */

.timer-box{
background:#111827;
padding:40px;
border-radius:30px;
text-align:center;
max-width:500px;
}

.time{
font-size:5rem;
font-weight:800;
margin:40px 0;
}

/* QUOTES */

.quote-box{
background:#111827;
padding:40px;
border-radius:28px;
max-width:700px;
}

.quote{
font-size:1.4rem;
line-height:1.8;
margin-bottom:20px;
}

.author{
color:#94A3B8;
}

/* MOBILE */

@media(max-width:768px){

.sidebar{
display:none;
}

.main{
margin-left:0;
padding:20px;
}

.hero h1{
font-size:2.8rem;
}

}

</style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

<div class="logo">
StudyHub ✨
</div>

<button class="nav-btn active" onclick="showTab('dashboard',this)">
🏠 Dashboard
</button>

<button class="nav-btn" onclick="showTab('tasks',this)">
✅ Tasks
</button>

<button class="nav-btn" onclick="showTab('pomodoro',this)">
⏳ Pomodoro
</button>

<button class="nav-btn" onclick="showTab('notes',this)">
📝 Notes
</button>

<button class="nav-btn" onclick="showTab('quotes',this)">
💡 Motivation
</button>

</div>

<!-- MAIN -->

<div class="main">

<!-- DASHBOARD -->

<div class="tab active" id="dashboard">

<div class="hero">

<h1>Study Better ✨</h1>

<p>
A modern productivity workspace with tasks,
notes, focus sessions and motivational quotes.
</p>

</div>

<div class="grid">

<div class="card">
<small>Total Tasks</small>
<h2 id="taskCount">0</h2>
</div>

<div class="card">
<small>Total Notes</small>
<h2 id="noteCount">0</h2>
</div>

<div class="card">
<small>Focus Time</small>
<h2>25m</h2>
</div>

<div class="card">
<small>Current Streak</small>
<h2>14</h2>
</div>

</div>

</div>

<!-- TASKS -->

<div class="tab" id="tasks">

<h1 class="section-title">
Task Manager
</h1>

<div class="input-group">

<input type="text" id="taskInput" placeholder="Enter task">

<button onclick="addTask()">
Add
</button>

</div>

<div id="taskList"></div>

</div>

<!-- POMODORO -->

<div class="tab" id="pomodoro">

<h1 class="section-title">
Pomodoro Timer
</h1>

<div class="timer-box">

<div class="time" id="timer">
25:00
</div>

<button onclick="startTimer()">
Start
</button>

<button onclick="resetTimer()">
Reset
</button>

</div>

</div>

<!-- NOTES -->

<div class="tab" id="notes">

<h1 class="section-title">
Notes
</h1>

<div class="input-group">

<textarea id="noteInput" placeholder="Write note"></textarea>

<button onclick="addNote()">
Save
</button>

</div>

<div id="notesList"></div>

</div>

<!-- QUOTES -->

<div class="tab" id="quotes">

<h1 class="section-title">
Motivational Quotes
</h1>

<div class="quote-box">

<div class="quote" id="quote">
Click below to load quote ✨
</div>

<div class="author" id="author">
—
</div>

<br>

<button onclick="getQuote()">
Get Quote
</button>

</div>

</div>

</div>

<script>

/* TABS */

function showTab(id,btn){

document.querySelectorAll('.tab').forEach(tab=>{
tab.classList.remove('active');
});

document.getElementById(id).classList.add('active');

document.querySelectorAll('.nav-btn').forEach(button=>{
button.classList.remove('active');
});

btn.classList.add('active');

}

/* TASKS */

let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

function saveTasks(){
localStorage.setItem('tasks', JSON.stringify(tasks));
}

function renderTasks(){

const taskList = document.getElementById('taskList');

taskList.innerHTML = '';

tasks.forEach((task,index)=>{

const div = document.createElement('div');

div.className = 'task';

div.innerHTML = `
<span>${task}</span>
<button class="delete-btn" onclick="deleteTask(${index})">
Delete
</button>
`;

taskList.appendChild(div);

});

document.getElementById('taskCount').innerText = tasks.length;

saveTasks();

}

function addTask(){

const input = document.getElementById('taskInput');

if(input.value.trim() === '') return;

tasks.push(input.value);

input.value = '';

renderTasks();

}

function deleteTask(index){

tasks.splice(index,1);

renderTasks();

}

renderTasks();

/* NOTES */

let notes = JSON.parse(localStorage.getItem('notes')) || [];

function saveNotes(){
localStorage.setItem('notes', JSON.stringify(notes));
}

function renderNotes(){

const notesList = document.getElementById('notesList');

notesList.innerHTML = '';

notes.forEach(note=>{

const div = document.createElement('div');

div.className = 'note';

div.innerHTML = note;

notesList.appendChild(div);

});

document.getElementById('noteCount').innerText = notes.length;

saveNotes();

}

function addNote(){

const input = document.getElementById('noteInput');

if(input.value.trim() === '') return;

notes.push(input.value);

input.value = '';

renderNotes();

}

renderNotes();

/* TIMER */

let time = 1500;
let running = false;
let interval;

function updateTimer(){

const mins = Math.floor(time / 60);
const secs = time % 60;

document.getElementById('timer').innerText =
`${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;

}

function startTimer(){

if(running) return;

running = true;

interval = setInterval(()=>{

time--;

updateTimer();

if(time <= 0){

clearInterval(interval);

running = false;

alert('Focus Session Complete ✨');

}

},1000);

}

function resetTimer(){

clearInterval(interval);

running = false;

time = 1500;

updateTimer();

}

updateTimer();

/* FETCH API */

async function getQuote(){

try{

const response = await fetch('https://dummyjson.com/quotes/random');

const data = await response.json();

document.getElementById('quote').innerText =
`"${data.quote}"`;

document.getElementById('author').innerText =
`— ${data.author}`;

}

catch(error){

document.getElementById('quote').innerText =
'Failed to load quote';

}

}

</script>

</body>
</html>
